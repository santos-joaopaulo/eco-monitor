name: eco_monitor
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  mapbox_maps_flutter: ^3.34.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.8
  connectivity_plus: ^6.1.4
  geolocator: ^14.1.2
  url_launcher: ^6.3.2
  material_ui: ^1.11.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/data/collect_points.json
    - assets/data/campaigns.json
    # Token público do Mapbox (gitignored; opcional, fallback do --dart-define)
    - assets/config/mapbox_token.txt
